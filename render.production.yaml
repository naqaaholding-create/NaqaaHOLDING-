services:
  - type: web
    name: naqaa-market-api-production
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: naqaa-finance-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: DATABASE_PATH
        value: /var/data/naqaa_market.db
      - key: DATABASE_PERSISTENT
        value: "1"
      - key: REAL_MONEY_ENABLED
        value: "0"
      - key: PRODUCTION_APPROVED
        value: "0"
      - key: FINANCE_PRODUCTION_APPROVED
        value: "0"
      - key: KYC_KYB_PRODUCTION_APPROVED
        value: "0"
      - key: CORS_ORIGINS
        value: https://naqaaholding.wordpress.com,https://naqaaholding-create.github.io
      - key: REOWN_PROJECT_ID
        sync: false
      - key: REOWN_APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: NAQAA_ADMIN_KEY
        sync: false
