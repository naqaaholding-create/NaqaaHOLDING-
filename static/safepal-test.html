<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار SafePal | NAQAA</title><style>body{font-family:Arial,sans-serif;max-width:680px;margin:0 auto;padding:24px;background:#f7f3e8;color:#222}.card{background:#fff;padding:24px;border-radius:16px;margin-top:20px;box-shadow:0 4px 18px #0001}button{width:100%;padding:15px;border:0;border-radius:10px;background:#174b35;color:#fff;font-size:16px;font-weight:700}.value{word-break:break-all;background:#f2efe6;padding:14px;border-radius:10px;margin-top:12px}.ok{color:#174b35;font-weight:700}.bad{color:#a22}</style></head><body><h1>اختبار اتصال SafePal</h1><p>صفحة اختبار مستقلة — لا تحتاج إلى تسجيل دخول NAQAA.</p><div class="card"><button id="connect">اتصال SafePal وقراءة العنوان</button><div id="result" style="margin-top:18px"></div></div><div class="card"><b>الأمان</b><p>نقرأ العنوان العام فقط. لا نطلب Seed Phrase أو Private Key ولا ننفذ أي تحويل.</p></div><script>(async()=>{const result=document.getElementById('result');document.getElementById('connect').onclick=async()=>{result.textContent='جاري الاتصال...';if(!window.ethereum){result.innerHTML='<span class="bad">لم يتم العثور على مزود محفظة. افتح هذه الصفحة من متصفح SafePal أو استخدم SafePal Extension.</span>';return}try{const accounts=await window.ethereum.request({method:'eth_requestAccounts'});const address=accounts?.[0];let chain=await window.ethereum.request({method:'eth_chainId'});if(!address||!/^0x[a-fA-F0-9]{40}$/.test(address))throw Error('تعذر قراءة عنوان EVM');if(chain!=='0x38'){try{await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x38'}]});chain=await window.ethereum.request({method:'eth_chainId'})}catch(e){throw Error('اختر BNB Smart Chain (Chain ID 56) في SafePal ثم أعد المحاولة')}}if(chain!=='0x38')throw Error('الشبكة الحالية ليست BNB Smart Chain');result.innerHTML='<div class="ok">✓ تم الاتصال بنجاح</div><p><b>العنوان العام:</b></p><div class="value">'+address+'</div><p><b>الشبكة:</b> BNB Smart Chain / BEP20 — Chain ID 56</p><p class="ok">لا تم إرسال أي معاملة ولم يتم حفظ أي مفتاح.</p>'}catch(e){result.innerHTML='<span class="bad">'+String(e.message||e)+'</span>'}}})();</script></body></html>
