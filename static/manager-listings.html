<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدير الإعلانات | NAQAA MARKET</title>
<link rel="stylesheet" href="assets/market.css">
<style>
.manager{max-width:1180px;margin:auto;padding:24px 14px 100px}
.head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}
.head h1{margin:0}.head p{color:#718287;margin:7px 0}
.badge{padding:9px 13px;border-radius:999px;background:#eef8f3;color:#07564b;border:1px solid #b9dccd;font-weight:900}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}
.toolbar button{border:1px solid #d8c99f;background:#fff;color:#17364d;padding:10px 14px;border-radius:12px;font-weight:900;cursor:pointer}
.toolbar button.active{background:#07564b;color:#fff}
.queue{display:grid;gap:12px}
.item{background:rgba(255,255,255,.94);border:1px solid #ddd3b9;border-radius:18px;padding:16px;box-shadow:0 12px 30px rgba(45,68,67,.08)}
.itemGrid{display:grid;grid-template-columns:130px 1fr;gap:14px}
.thumb{width:130px;height:105px;border-radius:14px;object-fit:cover;background:#edf3f1;display:grid;place-items:center;font-size:36px}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}.pill{padding:5px 9px;border-radius:999px;background:#f5f1e6;color:#80672e;font-size:11px;font-weight:900}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.actions button{border:0;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer}.publish{background:#07564b;color:#fff}.reject{background:#fff1f1;color:#9b3030;border:1px solid #e4b7b7!important}
.empty,.error{padding:20px;border-radius:16px;background:#fff;border:1px solid #ddd3b9}.error{color:#9b3030}
@media(max-width:620px){.itemGrid{grid-template-columns:1fr}.thumb{width:100%;height:180px}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="siteHeader"><div class="headerInner">
<a class="logo" href="index.html"><span class="logoMark">N</span><span><span class="logoName">NAQAA <span>MARKET</span></span><span class="logoSub">LISTING MANAGER</span></span></a>
<nav class="nav"><a href="index.html">الرئيسية</a><a href="market.html">السوق</a><a class="active" href="manager-listings.html">إدارة الإعلانات</a><a href="wallet.html">المحفظة</a></nav>
<a class="loginBtn" href="account.html">الحساب</a>
</div></header>
<main class="manager">
<div class="head"><div><h1>مدير الإعلانات</h1><p>مراجعة الإعلانات ثم نشرها في صفحة السوق. هذه الصلاحية لا تمنح صلاحيات مالية.</p></div><div id="roleBadge" class="badge">جارٍ التحقق...</div></div>
<div class="toolbar" id="tabs">
<button class="active" data-status="draft">مسودات المراجعة</button>
<button data-status="rejected">مرفوضة</button>
<button data-status="published">منشورة</button>
<button data-status="all">الكل</button>
</div>
<div id="queue" class="queue"></div>
</main>
<script>
const token=localStorage.getItem('naqaa_token')||localStorage.getItem('token');
const apiBase=(window.NAQAA_API_BASE||localStorage.getItem('naqa_api_base')||location.origin).replace(/\/$/,'');
let status='draft';
async function me(){if(!token){location.href='account.html';return null}const r=await fetch(apiBase+'/api/v1/auth/me?token='+encodeURIComponent(token));const d=await r.json().catch(()=>({}));if(!r.ok||d.role!=='manager'){document.getElementById('roleBadge').textContent='لا توجد صلاحية مدير';document.getElementById('queue').innerHTML='<div class="error">هذا القسم متاح لحساب مدير الإعلانات فقط.</div>';return null}document.getElementById('roleBadge').textContent='مدير الإعلانات ✓';return d}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function load(){const ok=await me();if(!ok)return;const box=document.getElementById('queue');box.innerHTML='<div class="empty">جارٍ تحميل الإعلانات...</div>';const r=await fetch(apiBase+'/api/v1/manager/listings?status='+encodeURIComponent(status)+'&token='+encodeURIComponent(token));const d=await r.json().catch(()=>[]);if(!r.ok){box.innerHTML='<div class="error">'+esc(d.detail||'تعذر تحميل الإعلانات')+'</div>';return}if(!d.length){box.innerHTML='<div class="empty">لا توجد إعلانات في هذا القسم.</div>';return}box.innerHTML=d.map(x=>{const img=x.image_data?'<img class="thumb" src="'+x.image_data+'" alt="">':'<div class="thumb">🏷️</div>';const can=x.status==='draft'||x.status==='rejected';return '<article class="item"><div class="itemGrid">'+img+'<div><h2>'+esc(x.title)+'</h2><div class="meta"><span class="pill">'+esc(x.category)+'</span><span class="pill">'+esc(x.amount)+' '+esc(x.currency)+'</span><span class="pill">البائع: '+esc(x.seller_name)+'</span><span class="pill">الحالة: '+esc(x.status)+'</span></div><p>'+esc(x.description)+'</p><small>البريد: '+esc(x.seller_email)+'</small>'+ (can?'<div class="actions"><button class="publish" onclick="publishListing(\''+x.id+'\')">✓ نشر في السوق</button><button class="reject" onclick="rejectListing(\''+x.id+'\')">رفض الإعلان</button></div>':'')+'</div></div></article>'}).join('')}
async function action(id,kind){const r=await fetch(apiBase+'/api/v1/manager/listings/'+encodeURIComponent(id)+'/'+kind+'?token='+encodeURIComponent(token),{method:'POST'});const d=await r.json().catch(()=>({}));if(!r.ok){alert(d.detail||'تعذر تنفيذ العملية');return}await load()}
function publishListing(id){if(confirm('تأكيد نشر الإعلان في صفحة السوق؟'))action(id,'publish')}
function rejectListing(id){if(confirm('تأكيد رفض الإعلان وإبقائه خارج السوق؟'))action(id,'reject')}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{status=b.dataset.status;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));load()}));
load();
</script>
</body></html>
