<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفعيل حساب الموظف | NAQAA MARKET</title><link rel="stylesheet" href="assets/market.css">
<style>
body{background:linear-gradient(135deg,#f6f3e8,#eef8f3);min-height:100vh}.activate{max-width:560px;margin:40px auto;padding:0 14px}.card{background:#fff;border:1px solid #e2d7b9;border-radius:24px;padding:24px;box-shadow:0 18px 55px rgba(20,65,55,.12)}.brand{color:#075b50;font-weight:950;font-size:25px}.muted{color:#687b75}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px;color:#31584f}.field input{width:100%;box-sizing:border-box;border:1px solid #d6d0c0;border-radius:12px;padding:13px;background:#fff}.btn{width:100%;border:0;border-radius:13px;padding:13px;background:#075b50;color:#fff;font-weight:900;cursor:pointer}.ok{background:#edf8f2;color:#075b50;border-radius:12px;padding:13px}.error{background:#fff0f0;color:#9b3030;border-radius:12px;padding:13px}
</style></head>
<body><main class="activate"><div class="card">
<div class="brand">NAQAA MARKET</div><h1>تفعيل حساب الموظف</h1><p class="muted">هذه الدعوة صادرة من إدارة سوق نقاء. بعد التفعيل ستدخل مباشرة إلى بوابة الموظف.</p>
<div id="inviteInfo" class="muted">جاري التحقق من الدعوة...</div>
<form id="form" style="display:none"><div class="field"><label>كلمة المرور الجديدة</label><input id="pass" type="password" minlength="8" required></div><div class="field"><label>تأكيد كلمة المرور</label><input id="pass2" type="password" minlength="8" required></div><button class="btn" type="submit">تفعيل الحساب والدخول</button></form>
<div id="result" style="margin-top:14px"></div>
</div></main>
<script>
const API=(window.NAQAA_API_BASE||localStorage.getItem('naqa_api_base')||location.origin).replace(/\/$/,'');
const invite=new URLSearchParams(location.search).get('invite')||'';
let info=null;
function show(id,html){document.getElementById(id).innerHTML=html}
async function load(){
 if(!invite){show('inviteInfo','<div class="error">رابط الدعوة غير مكتمل.</div>');return}
 try{const r=await fetch(API+'/api/v1/company/employee-invites/'+encodeURIComponent(invite));const d=await r.json();if(!r.ok)throw Error(d.detail||'الدعوة غير صالحة');info=d;show('inviteInfo','<div class="ok"><b>الاسم:</b> '+d.name+'<br><b>البريد:</b> '+d.email+'<br><b>القسم:</b> '+d.department_name+'<br><b>المسمى:</b> '+d.job_title+'</div>');document.getElementById('form').style.display='block'}catch(e){show('inviteInfo','<div class="error">'+e.message+'</div>')}}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('pass').value,p2=document.getElementById('pass2').value;if(p.length<8||p!==p2){show('result','<div class="error">تأكد من أن كلمة المرور 8 أحرف على الأقل ومتطابقة.</div>');return}try{const r=await fetch(API+'/api/v1/company/employee-invites/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:invite,password:p})});const d=await r.json();if(!r.ok)throw Error(d.detail||'تعذر تفعيل الحساب');localStorage.setItem('naqaa_token',d.token);localStorage.setItem('token',d.token);localStorage.setItem('naqaa_user_id',d.user.id);localStorage.setItem('naqaa_role','employee');show('result','<div class="ok">✓ تم تفعيل الحساب. جارٍ فتح لوحة الموظف...</div>');setTimeout(()=>location.replace('employee.html'),500)}catch(e){show('result','<div class="error">'+e.message+'</div>')}};
load();
</script><script src="mobile-runtime.js?v=20261006a"></script></body></html>
