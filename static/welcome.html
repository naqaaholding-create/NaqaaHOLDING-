<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مرحباً بكم | NAQAA MARKET</title><meta name="theme-color" content="#07564b"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif}body{min-height:100svh;background:linear-gradient(135deg,#f7f4e9,#eaf4ef 55%,#dcece6);color:#fff;display:grid;place-items:center;overflow:hidden}.bg{position:fixed;inset:0;background:radial-gradient(circle at 75% 20%,rgba(201,163,77,.28),transparent 28%),linear-gradient(135deg,rgba(4,48,39,.96),rgba(7,86,75,.9));}.card{position:relative;width:min(520px,100%);min-height:100svh;padding:36px 22px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-left:1px solid rgba(231,201,104,.5);border-right:1px solid rgba(231,201,104,.5)}.logo{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#27ad74,#07564b);border:4px solid #e7c968;box-shadow:0 0 0 8px rgba(231,201,104,.12),0 18px 45px rgba(0,0,0,.25);font-size:54px;font-weight:950;margin-bottom:18px}.brand{font-size:clamp(43px,12vw,68px);font-weight:950;letter-spacing:5px;line-height:1}.brand span{display:block;color:#e7c968;font-size:.4em;letter-spacing:9px;margin-top:8px}.holding{margin-top:23px;font-size:clamp(16px,4.8vw,23px);font-weight:900}.market{margin-top:9px;color:#27c27c;font-size:clamp(26px,7vw,38px);font-weight:950}.en{font-size:16px;color:#e7eee9;margin-top:5px}.tag{font-size:12px;line-height:1.9;color:#dce7e1;max-width:430px;margin:20px auto 25px}.tag b{color:#e7c968}.title{color:#e7c968;font-size:13px;margin-bottom:12px}.langs{width:min(390px,100%);display:grid;grid-template-columns:1fr 1fr;gap:10px}.langs button{min-height:56px;border:1px solid #e7c968;border-radius:15px;background:#fff;color:#07564b;font-size:16px;font-weight:950;cursor:pointer}.note{font-size:10px;color:#cddbd3;margin-top:17px}@media(max-width:380px){.card{padding:25px 16px}.logo{width:92px;height:92px;font-size:45px}.tag{margin:15px auto 18px;font-size:11px}} </style></head><body><div class="bg"></div><main class="card"><div class="logo">N</div><div class="brand">NAQAA<span>MARKET</span></div><div class="holding">نقاء القابضة للمقاولات والاستدامة</div><div class="market">سوق نقاء</div><div class="en">NAQAA MARKET</div><p class="tag"><b>أهلاً وسهلاً بكم</b><br>منصة تجمع العقارات والمستلزمات والخدمات والحلول المستدامة<br><span>A marketplace for real estate, supplies, services and sustainable solutions</span></p><div class="title">اختر لغتك / Choose your language</div><div class="langs"><button data-lang="ar">🇸🇦 العربية</button><button data-lang="en">🇬🇧 English</button></div><div class="note">اختر اللغة للدخول إلى التطبيق</div></main><script>document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{localStorage.setItem("naqaa_lang",b.dataset.lang);localStorage.setItem("naqaa_lang_selected","1");location.replace("index.html")}));</script></body></html>
