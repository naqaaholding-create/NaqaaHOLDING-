name: Financial tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NAQAA_ADMIN_KEY: ci-admin-key
  REAL_MONEY_ENABLED: '0'
  PRODUCTION_APPROVED: '0'
  FINANCE_PRODUCTION_APPROVED: '0'
  KYC_KYB_PRODUCTION_APPROVED: '0'
  DATABASE_PERSISTENT: '0'
  DATABASE_PATH: /tmp/naqaa_market_ci.db
  CWALLET_ENABLED: '0'
  CWALLET_PROTOCOL_VERIFIED: '0'
  CWALLET_LIVE_CONTRACT_VERIFIED: '0'
  CWALLET_ENV: sandbox
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_finance_ledger.py tests/test_financial_flows.py tests/test_marketplace_finance.py tests/test_security_finance.py tests/test_crypto_wallet.py tests/test_crypto_withdrawal_lifecycle.py
      - name: Run crypto API flow tests with isolated settlement gate
        env:
          REAL_MONEY_ENABLED: '1'
          PRODUCTION_APPROVED: '1'
          FINANCE_PRODUCTION_APPROVED: '1'
          KYC_KYB_PRODUCTION_APPROVED: '1'
          DATABASE_PERSISTENT: '1'
          DATABASE_PATH: /tmp/naqaa_crypto_ci.db
          CWALLET_ENABLED: '1'
          CWALLET_PROTOCOL_VERIFIED: '1'
          CWALLET_LIVE_CONTRACT_VERIFIED: '1'
          CWALLET_ENV: production
          CWALLET_API_BASE_URL: https://provider.invalid
          CWALLET_API_KEY: ci-key
          CWALLET_API_SECRET: ci-secret
          CWALLET_PAYMENT_PATH: /payments
          CWALLET_PAYOUT_PATH: /payouts
          CWALLET_WEBHOOK_SECRET: ci-webhook-secret
          CRYPTO_LIVE_ENABLED: '1'
        run: pytest -q tests/test_crypto_api_flow.py
