name: NAQAA backend syntax check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile app.py finance_ledger.py
      - run: pip install -r requirements.txt
      - run: python - <<'PY'
from finance_ledger import to_cents
assert to_cents("1000.00") == 100000
assert to_cents("0.01") == 1
print("financial precision checks passed")
PY
