name: NAQAA Market Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  ANDROID_VERSION_CODE: 2
  ANDROID_VERSION_NAME: 1.0.1
  ANDROID_TARGET_SDK: 35
  ANDROID_MIN_SDK: 23

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap copy android

      - name: Set Android version
        working-directory: android
        env:
          VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
          VERSION_NAME: ${{ env.ANDROID_VERSION_NAME }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path("app/build.gradle")
          text = path.read_text(encoding="utf-8")
          text, code_count = re.subn(r'versionCode\s+\d+', f'versionCode {os.environ["VERSION_CODE"]}', text, count=1)
          text, name_count = re.subn(r'versionName\s+"[^"]*"', f'versionName "{os.environ["VERSION_NAME"]}"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit(f"Could not update Android version fields: versionCode={code_count}, versionName={name_count}")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Set Google Play target SDK
        working-directory: android
        env:
          TARGET_SDK: ${{ env.ANDROID_TARGET_SDK }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path("app/build.gradle")
          s=p.read_text(encoding="utf-8")
          target=os.environ["TARGET_SDK"]
          s,n1=re.subn(r"(?m)^\s*targetSdk(?:Version)?\s*(?:=\s*)?.*$", f"    targetSdkVersion {target}", s, count=1)
          s,n2=re.subn(r"(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?.*$", f"    compileSdkVersion {target}", s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"Could not set Android SDK: target={n1}, compile={n2}")
          p.write_text(s,encoding="utf-8")
          PY

      - name: Detect or create signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || env.TEST_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || env.TEST_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || env.TEST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || env.TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "SIGNING_READY=1" >> "$GITHUB_ENV"
          else
            echo "SIGNING_READY=1" >> "$GITHUB_ENV"
            echo "Generating signed test release key."
            keytool -genkeypair -v -keystore android/naqaa-test-key.jks -storepass naqaa-test-store -keypass naqaa-test-key -alias naqaa-test -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NAQAA Market, OU=NAQAA, O=NAQAA Holding, L=Global, C=US"
            echo "TEST_KEYSTORE_B64=$(base64 -w0 android/naqaa-test-key.jks)" >> "$GITHUB_ENV"
            echo "TEST_STORE_PASSWORD=naqaa-test-store" >> "$GITHUB_ENV"
            echo "TEST_KEY_ALIAS=naqaa-test" >> "$GITHUB_ENV"
            echo "TEST_KEY_PASSWORD=naqaa-test-key" >> "$GITHUB_ENV"
          fi

      - name: Configure production signing
        if: env.SIGNING_READY == '1'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > naqaa-upload-key.jks
          test -s naqaa-upload-key.jks
          cat > keystore.properties <<EOF
          storeFile=naqaa-upload-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")
          prefix = """def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """
          if "keystore.properties" not in s:
              s = prefix + s
          if "signingConfigs {" not in s:
              marker = "android {"
              signing = """android {
              signingConfigs {
                  release {
                      storeFile rootProject.file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }
          """
              s = s.replace(marker, signing, 1)
          marker = "buildTypes {"
          pos = s.find(marker)
          if pos == -1:
              raise SystemExit("buildTypes block not found")
          rel = s.find("release {", pos)
          if rel == -1:
              raise SystemExit("release build type not found")
          block_end = s.find("}", rel)
          if "signingConfig signingConfigs.release" not in s[rel:block_end]:
              insert_at = rel + len("release {")
              s = s[:insert_at] + "\n            signingConfig signingConfigs.release" + s[insert_at:]
          p.write_text(s, encoding="utf-8")
          PY

      - name: Enforce Android 8.1+ compatibility
        working-directory: android
        env:
          MIN_SDK: ${{ env.ANDROID_MIN_SDK }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path("app/build.gradle")
          s=p.read_text(encoding="utf-8")
          s,n=re.subn(r"(?m)^\s*minSdk(?:Version)?\s*(?:=\s*)?.*$", f"    minSdkVersion {os.environ['MIN_SDK']}", s, count=1)
          if n != 1:
              raise SystemExit("Could not set minSdkVersion")
          p.write_text(s,encoding="utf-8")
          PY

      - name: Build signed Android release package
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify Android outputs
        run: |
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          AAB="$(find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -s "$APK"
          test -s "$AAB"
          apksigner verify --verbose "$APK"
          jarsigner -verify "$AAB"
          echo "SIGNED_RELEASE_VERIFIED"

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: naqaa-market-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: |
          rm -f android/naqaa-upload-key.jks android/naqaa-test-key.jks android/keystore.properties
