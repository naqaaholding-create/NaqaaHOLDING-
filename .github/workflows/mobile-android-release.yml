name: NAQAA Market Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap copy android

      - name: Build release
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify release outputs
        run: |
          echo "APK outputs:"
          find android/app/build/outputs/apk -type f -maxdepth 3 -print -exec ls -lh {} \; || true
          echo "Bundle outputs:"
          find android/app/build/outputs/bundle -type f -maxdepth 3 -print -exec ls -lh {} \; || true
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          AAB="$(find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          test -n "$AAB"
          test -s "$AAB"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: naqaa-market-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

# Release artifact verification hardened
