name: NAQAA automated tests
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  NAQAA_ADMIN_KEY: ci-admin-key
  REAL_MONEY_ENABLED: '0'
  PYTHONPATH: .
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_marketplace_finance.py
