name: Android CI APK build

on:
  push:
    branches: [main, fix/account-page-flow-clean]
    paths:
      - "static/**"
      - ".github/workflows/pr-android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "static/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.*"
      - ".github/workflows/pr-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (strict lockfile validation)
        run: npm ci
      - name: Add Android platform
        run: npx cap add android
      - name: Generate NAQAA Android icon and splash assets
        run: npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#061b15' --splashBackgroundColor '#061b15'
      - name: Sync web app
        run: npx cap sync android
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload Android CI debug APK
        uses: actions/upload-artifact@v4
        with:
          name: naqaa-market-ci-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
