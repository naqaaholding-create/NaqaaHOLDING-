name: NAQAA financial tests
# CI regression gate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  NAQAA_ADMIN_KEY: ci-admin-key
  REAL_MONEY_ENABLED: '0'
  CWALLET_ENABLED: '0'
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_finance_ledger.py tests/test_financial_flows.py tests/test_marketplace_finance.py tests/test_security_finance.py tests/test_compliance_contract_security.py tests/test_finance.py tests/test_financial_reports.py tests/test_dispute_audit.py tests/test_rejected_dispute.py tests/test_escrow_transition.py tests/test_cwallet_provider.py tests/test_cwallet_integration.py tests/test_crypto_wallet.py tests/test_crypto_withdrawal_lifecycle.py tests/test_crypto_api_flow.py tests/test_production_preflight.py tests/test_production_gate.py
