name: NAQAA financial tests
# CI regression gate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  NAQAA_ADMIN_KEY: ci-admin-key
  # CI-only mock settlement configuration; Railway production remains disabled.
  REAL_MONEY_ENABLED: '1'
  PRODUCTION_APPROVED: '1'
  FINANCE_PRODUCTION_APPROVED: '1'
  KYC_KYB_PRODUCTION_APPROVED: '1'
  DATABASE_PERSISTENT: '1'
  DATABASE_PATH: /tmp/naqaa_market_ci.db
  CWALLET_ENABLED: '1'
  CWALLET_PROTOCOL_VERIFIED: '1'
  CWALLET_LIVE_CONTRACT_VERIFIED: '1'
  CWALLET_ENV: production
  CWALLET_API_BASE_URL: https://provider.invalid
  CWALLET_API_KEY: ci-test
  CWALLET_API_SECRET: ci-test
  CWALLET_PAYMENT_PATH: /payment
  CWALLET_PAYOUT_PATH: /payout
  CWALLET_WEBHOOK_SECRET: ci-test
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_finance_ledger.py tests/test_financial_flows.py tests/test_marketplace_finance.py tests/test_security_finance.py tests/test_compliance_contract_security.py tests/test_finance.py tests/test_financial_reports.py tests/test_dispute_audit.py tests/test_cwallet_provider.py tests/test_cwallet_integration.py tests/test_crypto_wallet.py tests/test_crypto_withdrawal_lifecycle.py tests/test_crypto_api_flow.py tests/test_production_preflight.py tests/test_production_gate.py
