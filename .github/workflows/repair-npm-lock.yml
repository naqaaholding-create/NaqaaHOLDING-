name: Repair npm lockfile

on:
  push:
    branches:
      - fix/npm-lockfile-sync-20261019
    paths:
      - .github/workflows/repair-npm-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/npm-lockfile-sync-20261019
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
          else
            git commit -m "fix: synchronize npm lockfile [skip ci]"
            git push origin HEAD:fix/npm-lockfile-sync-20261019
          fi
