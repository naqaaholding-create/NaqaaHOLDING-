name: Backend syntax check
on:
  push:
    paths:
      - "app.py"
      - "*.py"
      - ".github/workflows/backend-syntax.yml"
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: |
          python -m py_compile app.py
          python -m py_compile finance_ledger.py
          python -m py_compile crypto_wallet.py
          python -m py_compile crypto_routes.py
