name: NAQAA Market iOS Store Archive

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"

jobs:
  ios-store:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode version
        run: |
          xcodebuild -version
          MAJOR="$(xcodebuild -version | awk '/Xcode/ {print $2}' | cut -d. -f1)"
          if [ "$MAJOR" -lt 26 ]; then
            echo "Xcode 26 or newer is required for App Store submission."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate iOS project
        run: npx cap add ios

      - name: Sync web app
        run: npx cap copy ios

      - name: Install signing certificate and provisioning profile
        env:
          P12_B64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_TEMP_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for v in P12_B64 P12_PASSWORD PROFILE_B64 KEYCHAIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "Missing required GitHub secret: $v"
              exit 1
            fi
          done
          KEYCHAIN="$RUNNER_TEMP/naqaa-signing.keychain-db"
          CERT="$RUNNER_TEMP/distribution.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$P12_B64" | base64 --decode > "$CERT"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/naqaa.mobileprovision"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Archive App Store build
        working-directory: ios/App
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          PROFILE_NAME: ${{ env.PROFILE_NAME }}
          TEAM_ID: ${{ env.TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild             -workspace App.xcworkspace             -scheme App             -configuration "$CONFIGURATION"             -sdk iphoneos             -archivePath "$RUNNER_TEMP/NAQAA-Market.xcarchive"             CODE_SIGN_STYLE=Manual             DEVELOPMENT_TEAM="$TEAM_ID"             PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"             CODE_SIGN_IDENTITY="Apple Distribution"             archive

      - name: Export IPA
        working-directory: ios/App
        env:
          TEAM_ID: ${{ env.TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>com.naqaaholding.market</key><string>${{ env.PROFILE_NAME }}</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive             -archivePath "$RUNNER_TEMP/NAQAA-Market.xcarchive"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: naqaa-market-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Clean signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          security delete-keychain "$RUNNER_TEMP/naqaa-signing.keychain-db" 2>/dev/null || true
