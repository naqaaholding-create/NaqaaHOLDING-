services:
  - type: web
    name: naqaa-market-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: REAL_MONEY_ENABLED
        value: "0"
      - key: STRIPE_LIVE_ENABLED
        value: "0"
      - key: CORS_ORIGINS
        value: "https://naqaaholding.wordpress.com"
      # Safety defaults: keep all real-money controls OFF until production
      # infrastructure and provider verification are completed.
      - key: DATABASE_PERSISTENT
        value: "0"
      - key: PRODUCTION_APPROVED
        value: "0"
      - key: KYC_KYB_PRODUCTION_APPROVED
        value: "0"
      - key: FINANCE_PRODUCTION_APPROVED
        value: "0"
      - key: DATABASE_PATH
        value: "/tmp/naqaa_market.db"
      - key: CWALLET_ENABLED
        value: "0"
      - key: CWALLET_PROTOCOL_VERIFIED
        value: "0"
      - key: CWALLET_API_BASE_URL
        sync: false
      - key: CWALLET_API_KEY
        sync: false
      - key: CWALLET_API_SECRET
        sync: false
      - key: CWALLET_PAYMENT_PATH
        sync: false
      - key: CWALLET_PAYOUT_PATH
        sync: false
      - key: CWALLET_WEBHOOK_SECRET
        sync: false
