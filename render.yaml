services:
  - type: web
    name: naqaa-market-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # PostgreSQL is mandatory at runtime; set the Supabase connection string
      # as a secret in Render before deploying this Blueprint.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PATH
        value: "naqaa_market"
      - key: REAL_MONEY_ENABLED
        value: "0"
      - key: STRIPE_LIVE_ENABLED
        value: "0"
      # Keep persistence approval false until the configured external database
      # has been verified with restart + data-retention tests.
      - key: DATABASE_PERSISTENT
        value: "0"
      - key: PRODUCTION_APPROVED
        value: "0"
      - key: FINANCE_PRODUCTION_APPROVED
        value: "0"
      - key: KYC_KYB_PRODUCTION_APPROVED
        value: "0"
      - key: CORS_ORIGINS
        value: "https://naqaaholding-create.github.io"
      - key: REOWN_PROJECT_ID
        sync: false
      - key: REOWN_APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: NAQAA_ADMIN_KEY
        sync: false
